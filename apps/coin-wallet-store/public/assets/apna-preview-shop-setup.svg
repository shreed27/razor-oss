<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f6f1"/><stop offset="1" stop-color="#edf1ff"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#2855dc"/><stop offset="1" stop-color="#2144ba"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17233f" flood-opacity=".14"/></filter></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><text x="105" y="151" fill="#244bd0" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2">APNA SHOP SETUP</text><text x="105" y="204" fill="#17233f" font-family="Arial" font-size="39" font-weight="700">Your shop starts with a chat.</text><text x="105" y="239" fill="#68748c" font-family="Arial" font-size="16">Add a business name, products, and your UPI ID. Get a link and QR.</text><g filter="url(#shadow)"><rect x="105" y="279" width="990" height="403" rx="23" fill="#fff"/></g><rect x="105" y="279" width="990" height="62" rx="23" fill="#fff"/><path d="M105 319h990v22H105z" fill="#fff"/><rect x="132" y="294" width="33" height="33" rx="11" fill="url(#blue)"/><text x="148" y="317" fill="#fff" font-family="Arial" font-size="19" font-weight="700" text-anchor="middle">↯</text><text x="178" y="314" fill="#17233f" font-family="Arial" font-size="15" font-weight="700">Apna shop assistant</text><text x="1064" y="314" fill="#16804d" font-family="Arial" font-size="11" font-weight="700" text-anchor="end">● READY</text><rect x="105" y="341" width="990" height="6" fill="#f0f2f7"/><rect x="105" y="341" width="594" height="6" fill="#4164dd"/><rect x="144" y="375" width="494" height="60" rx="15" fill="#f1f3f8"/><text x="165" y="401" fill="#384561" font-family="Arial" font-size="13">What do you sell, and what does each item cost?</text><text x="165" y="421" fill="#8791a3" font-family="Arial" font-size="10">APNA ASSISTANT</text><rect x="427" y="450" width="211" height="51" rx="15" fill="url(#blue)"/><text x="448" y="481" fill="#fff" font-family="Arial" font-size="13">Mango pickle | ₹250</text><rect x="144" y="517" width="494" height="74" rx="15" fill="#f1f3f8"/><text x="165" y="546" fill="#384561" font-family="Arial" font-size="13">Nice. I’ve added it. What UPI ID should</text><text x="165" y="567" fill="#384561" font-family="Arial" font-size="13">receive your payments?</text><rect x="674" y="366" width="382" height="273" rx="18" fill="#faf9f6" stroke="#eae9e2"/><text x="699" y="401" fill="#17233f" font-family="Arial" font-size="12" font-weight="700">YOUR SHOP PREVIEW</text><rect x="699" y="419" width="332" height="72" rx="13" fill="#fff" stroke="#ededea"/><rect x="714" y="433" width="43" height="43" rx="12" fill="#fff1df"/><text x="735" y="461" font-family="Arial" font-size="22" text-anchor="middle">🥭</text><text x="770" y="450" fill="#17233f" font-family="Arial" font-size="12" font-weight="700">Mango pickle</text><text x="770" y="470" fill="#68748c" font-family="Arial" font-size="11">₹250 · Pay with UPI</text><rect x="699" y="506" width="332" height="54" rx="12" fill="#244bd0"/><text x="865" y="539" fill="#fff" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">Create my shop link</text><rect x="699" y="576" width="332" height="42" rx="11" fill="#fff" stroke="#e7e8eb"/><text x="715" y="602" fill="#244bd0" font-family="Arial" font-size="11">apna.ai/shop/meenas-pickles</text><text x="1041" y="602" fill="#244bd0" font-family="Arial" font-size="13">▦</text></svg>
